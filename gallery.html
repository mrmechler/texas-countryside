<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>320 Pecan 3 Photos | TexasCountryside.com</title>
<meta name="theme-color" content="#10130f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10130f;--paper:#fafaf7;--line:#dedfd7;--olive:#6d7845;--muted:#74786e;--max:1440px}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit}.wrap{width:min(var(--max),calc(100% - 64px));margin:auto}.topbar{height:76px;background:#111410;color:white;display:flex;align-items:center;position:sticky;top:0;z-index:30}.bar{display:flex;align-items:center;width:100%;gap:28px}.brand{margin-right:auto;text-transform:uppercase;line-height:.85}.brand span{display:block;font-size:9px;font-weight:700;letter-spacing:.25em}.brand strong{display:block;font-size:13px;font-weight:650;letter-spacing:.17em;margin-top:6px}.back{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.75)}.back:hover{color:white}.hero{padding:76px 0 40px}.crumb{font-size:10px;color:var(--olive);font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:17px}.hero h1{font-size:clamp(48px,6vw,92px);line-height:.95;letter-spacing:-.06em;margin:0;font-weight:650}.hero p{font-size:14px;color:var(--muted);margin:18px 0 0}.tabs-wrap{position:sticky;top:76px;z-index:20;background:rgba(250,250,247,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.tabs{display:flex;gap:0;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:0;background:transparent;padding:19px 20px;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#74786e;cursor:pointer;border-bottom:2px solid transparent}.tab:first-child{padding-left:0}.tab.active{color:var(--ink);border-bottom-color:var(--olive)}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:34px 0 96px}.photo:nth-child(7n+1){grid-column:span 2;aspect-ratio:16/9}.photo:nth-child(7n+4){aspect-ratio:3/4}.photo{position:relative;aspect-ratio:4/3;overflow:hidden;background:#e6e7e1;cursor:zoom-in}.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s ease}.photo:hover img{transform:scale(1.018)}.photo-index{position:absolute;right:12px;bottom:10px;color:white;font-size:9px;font-weight:700;background:rgba(0,0,0,.45);padding:5px 7px}.lightbox{position:fixed;inset:0;background:rgba(8,10,8,.97);z-index:100;display:none;align-items:center;justify-content:center;padding:56px 78px;color:white}.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:calc(100vh - 100px);object-fit:contain;box-shadow:0 16px 80px rgba(0,0,0,.35)}.close,.prev,.next{position:absolute;border:0;background:transparent;color:white;cursor:pointer}.close{top:22px;right:25px;font-size:34px;font-weight:200}.prev,.next{top:50%;transform:translateY(-50%);font-size:44px;font-weight:200;padding:18px}.prev{left:12px}.next{right:12px}.lightbox-meta{position:absolute;left:28px;bottom:22px;font-size:10px;color:rgba(255,255,255,.65);letter-spacing:.08em;text-transform:uppercase}@media(max-width:900px){.wrap{width:calc(100% - 32px)}.gallery{grid-template-columns:repeat(2,1fr)}.photo:nth-child(7n+1){grid-column:span 2}.photo:nth-child(7n+4){aspect-ratio:4/3}.tab{padding:16px 14px}.lightbox{padding:54px 20px}.prev,.next{font-size:34px;background:rgba(0,0,0,.25)}}@media(max-width:580px){.hero{padding-top:54px}.hero h1{font-size:52px}.gallery{grid-template-columns:1fr;gap:8px}.photo,.photo:nth-child(7n+1),.photo:nth-child(7n+4){grid-column:auto;aspect-ratio:4/3}.topbar{height:68px}.tabs-wrap{top:68px}.back{font-size:9px}.brand strong{font-size:11px}.lightbox{padding:48px 8px}.prev{left:0}.next{right:0}}
</style>
</head>
<body>
<header class="topbar"><div class="bar wrap"><a class="brand" href="index.html"><span>Texas</span><strong>Countryside</strong></a><a class="back" href="index.html#explore">← Back to property</a></div></header>
<main>
<section class="hero wrap"><div class="crumb">320 Pecan 3 · Florence, Texas</div><h1 id="title">All Photos</h1><p id="count"></p></section>
<div class="tabs-wrap"><div class="tabs wrap" id="tabs"></div></div>
<section class="gallery wrap" id="gallery" aria-live="polite"></section>
</main>
<div class="lightbox" id="lightbox" aria-hidden="true"><button class="close" aria-label="Close">×</button><button class="prev" aria-label="Previous photo">‹</button><img alt=""><button class="next" aria-label="Next photo">›</button><div class="lightbox-meta" id="lightboxMeta"></div></div>
<script src="gallery-data.js"></script>
<script>
const order=['all','main-residence','attached-residence','guest-house','workshop','land-gardens','pool-outdoor','property-features','aerial'];
const labels={all:'All Photos',...CATEGORY_LABELS};
const params=new URLSearchParams(location.search);let current=PHOTO_SETS[params.get('category')]?params.get('category'):'all';
const allPhotos=()=>[...new Set(order.slice(1).flatMap(k=>PHOTO_SETS[k]||[]))];const getPhotos=()=>current==='all'?allPhotos():(PHOTO_SETS[current]||[]);
const title=document.getElementById('title'),count=document.getElementById('count'),gallery=document.getElementById('gallery'),tabs=document.getElementById('tabs');
let activeIndex=0;
function renderTabs(){tabs.innerHTML=order.map(k=>`<button class="tab ${k===current?'active':''}" data-cat="${k}">${labels[k]}</button>`).join('');tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{current=b.dataset.cat;history.replaceState(null,'',`?category=${current}`);render();scrollTo({top:0,behavior:'smooth'});});}
function render(){const photos=getPhotos();title.textContent=labels[current];count.textContent=`${photos.length} photographs · 320 Pecan 3`;gallery.innerHTML=photos.map((src,i)=>`<div class="photo" data-index="${i}"><img src="${src}" alt="${labels[current]} photo ${i+1} at 320 Pecan 3" loading="lazy"><span class="photo-index">${String(i+1).padStart(2,'0')}</span></div>`).join('');gallery.querySelectorAll('.photo').forEach(el=>el.onclick=()=>openLightbox(+el.dataset.index));renderTabs();document.title=`${labels[current]} | 320 Pecan 3 | TexasCountryside.com`;}
const lb=document.getElementById('lightbox'),lbImg=lb.querySelector('img'),meta=document.getElementById('lightboxMeta');
function openLightbox(i){activeIndex=i;updateLightbox();lb.classList.add('open');lb.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeLightbox(){lb.classList.remove('open');lb.setAttribute('aria-hidden','true');document.body.style.overflow=''}
function updateLightbox(){const p=getPhotos();activeIndex=(activeIndex+p.length)%p.length;lbImg.src=p[activeIndex];meta.textContent=`${labels[current]} · ${activeIndex+1} of ${p.length}`}
lb.querySelector('.close').onclick=closeLightbox;lb.querySelector('.prev').onclick=()=>{activeIndex--;updateLightbox()};lb.querySelector('.next').onclick=()=>{activeIndex++;updateLightbox()};lb.onclick=e=>{if(e.target===lb)closeLightbox()};addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft'){activeIndex--;updateLightbox()}if(e.key==='ArrowRight'){activeIndex++;updateLightbox()}});render();
</script>
</body></html>
